name: Generate and deploy to GitHub Pages hourly

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull source projects and generate pages
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate generated static site
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Open or update validation failure issue
        if: always() && steps.validate.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          HAS_TARGET_REPO_ISSUES_TOKEN: ${{ secrets.TARGET_REPO_ISSUES_TOKEN != '' }}
          TEST_OUTPUT_FILE: test-output.log
        with:
          github-token: ${{ secrets.TARGET_REPO_ISSUES_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            if (process.env.HAS_TARGET_REPO_ISSUES_TOKEN !== 'true') {
              core.setFailed('Add the TARGET_REPO_ISSUES_TOKEN repository secret with public_repo access so this workflow can manage issues in source repositories.');
              return;
            }
            const marker = '<!-- ok-websites:generated-site-validation -->';
            const title = '[ok-websites] Generated documentation validation failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const rawLog = fs.existsSync(process.env.TEST_OUTPUT_FILE)
              ? fs.readFileSync(process.env.TEST_OUTPUT_FILE, 'utf8').trim()
              : 'The validation step did not produce a log file.';
            const truncated = rawLog.length > 50000;
            const log = truncated ? rawLog.slice(-50000) : rawLog;
            const projects = JSON.parse(fs.readFileSync('projects.json', 'utf8')).projects;
            const escapeRegex = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const targets = projects.filter(project => {
              const identifiers = [project.id, project.outputFolder].filter(Boolean);
              return identifiers.some(identifier =>
                new RegExp(`(^|[\\s/:])${escapeRegex(identifier)}([\\s/:.]|$)`, 'i').test(rawLog)
              );
            });

            if (!targets.length) {
              core.setFailed('Could not determine a target project repository from the validation log.');
              return;
            }

            for (const project of targets) {
              const [owner, repo] = project.github.split('/');
              const target = { owner, repo };
              const body = `${marker}
              Documentation generated from ${context.serverUrl}/${owner}/${repo} failed validation in ok-websites.

              - Workflow run: ${runUrl}
              - Build commit: ${commitUrl}

              \`\`\`text
              ${truncated ? '[Earlier output truncated]\n' : ''}${log}
              \`\`\`

              This issue is maintained automatically. A successful build will close it.`;
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                ...target,
                state: 'all',
                per_page: 100,
              });
              const existing = issues.find(issue =>
                !issue.pull_request && issue.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.update({
                  ...target,
                  issue_number: existing.number,
                  title,
                  body,
                  state: 'open',
                });
                core.info(`Updated ${project.github}#${existing.number}.`);
              } else {
                const created = await github.rest.issues.create({
                  ...target,
                  title,
                  body,
                });
                core.info(`Created ${project.github}#${created.data.number}.`);
              }
            }
      - name: Close validation failure issue after recovery
        if: always() && steps.validate.outcome == 'success'
        uses: actions/github-script@v9
        env:
          HAS_TARGET_REPO_ISSUES_TOKEN: ${{ secrets.TARGET_REPO_ISSUES_TOKEN != '' }}
        with:
          github-token: ${{ secrets.TARGET_REPO_ISSUES_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            if (process.env.HAS_TARGET_REPO_ISSUES_TOKEN !== 'true') {
              core.setFailed('Add the TARGET_REPO_ISSUES_TOKEN repository secret with public_repo access so this workflow can close issues in source repositories.');
              return;
            }
            const marker = '<!-- ok-websites:generated-site-validation -->';
            const projects = JSON.parse(fs.readFileSync('projects.json', 'utf8')).projects;

            for (const project of projects) {
              const [owner, repo] = project.github.split('/');
              const target = { owner, repo };
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                ...target,
                state: 'open',
                per_page: 100,
              });
              const matching = issues.filter(issue =>
                !issue.pull_request && issue.body?.includes(marker)
              );

              for (const issue of matching) {
                await github.rest.issues.update({
                  ...target,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed ${project.github}#${issue.number}.`);
              }
            }
      - name: Fail build after reporting validation error
        if: steps.validate.outcome == 'failure'
        run: exit 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: static
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
