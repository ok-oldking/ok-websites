name: Generate and deploy to GitHub Pages hourly

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull source projects and generate pages
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate generated static site
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Open or update validation failure issue
        if: always() && steps.validate.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          TEST_OUTPUT_FILE: test-output.log
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ok-websites:generated-site-validation -->';
            const title = '[build] Generated site validation failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const rawLog = fs.existsSync(process.env.TEST_OUTPUT_FILE)
              ? fs.readFileSync(process.env.TEST_OUTPUT_FILE, 'utf8').trim()
              : 'The validation step did not produce a log file.';
            const truncated = rawLog.length > 50000;
            const log = truncated ? rawLog.slice(-50000) : rawLog;
            const body = `${marker}
            The generated site failed validation.

            - Workflow run: ${runUrl}
            - Commit: ${commitUrl}

            \`\`\`text
            ${truncated ? '[Earlier output truncated]\n' : ''}${log}
            \`\`\`

            This issue is maintained automatically. A successful build will close it.`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find(issue =>
              !issue.pull_request &&
              (issue.body?.includes(marker) || issue.title === title)
            );

            if (existing) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                title,
                body,
                state: 'open',
              });
              core.info(`Updated issue #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title,
                body,
              });
              core.info(`Created issue #${created.data.number}.`);
            }
      - name: Close validation failure issue after recovery
        if: always() && steps.validate.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- ok-websites:generated-site-validation -->';
            const title = '[build] Generated site validation failed';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const matching = issues.filter(issue =>
              !issue.pull_request &&
              (issue.body?.includes(marker) || issue.title === title)
            );

            for (const issue of matching) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed issue #${issue.number}.`);
            }
      - name: Fail build after reporting validation error
        if: steps.validate.outcome == 'failure'
        run: exit 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: static
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
