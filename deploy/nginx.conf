server {
    listen 80;
    listen [::]:80;
    server_name ok-ww.ok-script.com;
    root __SITE_ROOT__/ok-ww;
    index index.html;

    location ^~ /assets/ {
        alias __SITE_ROOT__/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.ok-script.com;
    root __SITE_ROOT__/app;
    index index.html;

    location ^~ /assets/ {
        alias __SITE_ROOT__/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ok-script.com *.ok-script.com;
    root __SITE_ROOT__;
    index index.html;

    charset utf-8;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
